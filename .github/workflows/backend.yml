name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

# Cancel in-flight runs when the same PR is pushed to again; nobody
# cares about a stale CI run on yesterday's commit.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # Postgres + Redis side-cars. The runtime app expects RLS on
      # crm_app (NOSUPERUSER, NOBYPASSRLS); CI starts with the bootstrap
      # `crm` role and the `create_crm_app_runtime_role` migration
      # spins up the runtime role. APP_DATABASE_URL falls back to
      # DATABASE_URL via `runtime_database_url` if absent.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports:
          - 5432:5432
        # Wait for the cluster to be ready before kicking off the job.
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Localhost works because GHA exposes service ports on the host.
      DATABASE_URL: postgresql+asyncpg://crm:crm@localhost:5432/crm
      SYNC_DATABASE_URL: postgresql://crm:crm@localhost:5432/crm
      APP_DATABASE_URL: postgresql+asyncpg://crm_app:crm_app_dev_2026@localhost:5432/crm
      REDIS_URL: redis://localhost:6379/0
      # 64-byte hex — meets the JWT_SECRET length guard in
      # config.validate_for_runtime so the app can boot in CI.
      JWT_SECRET: ci-${{ github.run_id }}-padding-padding-padding-padding-padding-padding
      ENVIRONMENT: ci
      # S3-compatible storage for the import/signature tests. Points at the
      # MinIO container started in the "Start MinIO" step below; the app's
      # lifespan `ensure_bucket()` creates the bucket on first boot.
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: crm-gallo-attachments

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format --check)
        # Fail if any file would be reformatted. Locally:
        # `ruff format .` to fix.
        run: ruff format --check .

      - name: Apply migrations
        # Validates the migration chain end-to-end against a real
        # Postgres. An invalid migration (broken op, missing column,
        # bad rev chain) fails here loudly.
        run: alembic upgrade head

      - name: Start MinIO (S3 storage for import / signature tests)
        # The `services:` block above can't run MinIO — the minio image
        # needs a `server /data` command and GH service containers can't
        # override the command. So run it as a plain container here. The
        # app creates the bucket on startup (lifespan -> ensure_bucket),
        # so no manual bucket-creation step is needed.
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null; then
              echo "MinIO is ready"; exit 0
            fi
            sleep 1
          done
          echo "MinIO failed to become ready" >&2
          exit 1

      - name: Run pytest
        run: python -m pytest tests/ -q

      - name: pip-audit (security scan)
        # Fails on any vulnerability with a known CVE. `--strict`
        # treats unresolved deps as a failure too, so the lockfile
        # has to actually match.
        #
        # Ignored vulnerabilities (revisit each on dep-bump rounds):
        #   PYSEC-2026-161 — starlette; needs starlette>=1.0.1 which
        #     requires FastAPI>=0.131. Tracked as follow-up TD-28.
        #   GHSA-7f5h-v6xp-fcq8 — superseded by 0.49.1; we ship 0.49.3.
        #     pip-audit's DB hasn't caught up. Re-check on next bump.
        #   GHSA-6w46-j5rx-g56g — pytest dev-only DoS via tmp paths;
        #     pytest>=9 requires pytest-asyncio>=0.25 which breaks our
        #     fixtures. Tracked as follow-up TD-29.
        run: |
          pip-audit --strict --requirement requirements.txt \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln GHSA-7f5h-v6xp-fcq8 \
            --ignore-vuln GHSA-6w46-j5rx-g56g
        continue-on-error: false
