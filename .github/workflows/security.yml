name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full-history sweep — catches anything pushed before
    # gitleaks was wired up, and any new rules in upstream that
    # match historical commits.
    - cron: "0 6 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      # The action posts a PR comment listing leaked secrets when
      # any are found. Read-only would silently swallow that signal.
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history always. gitleaks-action scans the pushed commit
          # RANGE (commits[0]^..after), so a shallow clone breaks on any
          # push with >1 commit: `fatal: ambiguous argument '<sha>^..<sha>':
          # unknown revision`. Full history costs ~30s and makes
          # multi-commit pushes scannable.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional pro license — without it the action runs in OSS
          # mode (still works, just no SARIF upload to GH Security).
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  trufflehog:
    # Second pass with a different rule set — trufflehog catches
    # patterns gitleaks misses (and vice versa). False positive rate
    # is higher; we keep this as a separate job so PR authors can
    # see "gitleaks clean, trufflehog noisy" and respond per-tool.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # trufflehog needs commit range to compare

      - name: trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          # Default base/head come from the PR context; falls back to
          # the full repo on push.
          extra_args: --results=verified,unknown
