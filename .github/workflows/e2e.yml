name: e2e

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose.yml"
      - "docker-compose.ci.yml"
      - ".env.example"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "docker-compose.yml"
      - "docker-compose.ci.yml"
      - ".env.example"
      - ".github/workflows/e2e.yml"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Dev defaults only — no real secrets. Stripe/email/Sentry are empty
      # (no-op), the JWT secret is a non-production placeholder, and
      # ENVIRONMENT=development so startup secret validation stays lenient.
      - name: Seed .env (dev defaults)
        # Then override APP_DATABASE_URL with a real (throwaway, non-secret)
        # password: the crm_app password-rotation migration f0a1b2c3d4e5 aborts
        # while it still carries the CHANGE_ME placeholder. CI uses an ephemeral
        # DB, so a fixed non-placeholder value is safe: the migration ALTERs the
        # crm_app role to match and the API connects with the same URL. The crm
        # owner (DATABASE_URL / POSTGRES_PASSWORD) stays CHANGE_ME.
        run: |
          cp .env.example .env
          sed -i 's#^APP_DATABASE_URL=.*#APP_DATABASE_URL=postgresql+asyncpg://crm_app:ci_app_pw_not_a_secret@db:5432/crm#' .env

      # Build + start only what the core smoke needs (see docker-compose.ci.yml):
      # Postgres, Redis, the API, the web app. No Ollama, no MinIO, no worker.
      # The backend's `alembic upgrade head` runs on container start, so once
      # /health answers the schema is migrated and the API is serving.
      - name: Start stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build db redis backend frontend

      - name: Wait for backend /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8001/health >/dev/null 2>&1; then
              echo "backend healthy"; exit 0
            fi
            sleep 5
          done
          echo "::error::backend never became healthy"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs backend
          exit 1

      - name: Wait for frontend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3030/en/login >/dev/null 2>&1; then
              echo "frontend up"; exit 0
            fi
            sleep 5
          done
          echo "::error::frontend never came up"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs frontend
          exit 1

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      # Cache the downloaded Chromium build (~150 MB) keyed on the exact
      # @playwright/test version, so a re-run with an unchanged version
      # skips the download. The OS-level libs (`install-deps`) live in
      # apt, not ~/.cache/ms-playwright, so they're (cheaply) re-applied
      # on every run regardless of the browser cache.
      - name: Resolve Playwright version
        id: pw
        working-directory: frontend
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      # SCORE_E2E is unset, so the LLM-backed scoring test self-skips and only
      # the deterministic core golden path runs. playwright.config picks up
      # CI=true automatically (github reporter, 1 retry).
      - name: Run e2e (core golden path)
        working-directory: frontend
        run: npx playwright test

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
