name: docker

# Builds + scans + publishes container images. Two trigger paths:
#   * `main` push  → build, scan, push as `:edge` (mutable, always
#                    the latest known-good main commit).
#   * tag push     → build, scan, push as `:vX.Y.Z` (immutable) AND
#                    `:latest` (mutable pointer to the newest stable
#                    release — distinct from `:edge`).
# PRs do build + scan but DON'T push, so we still catch a broken
# Dockerfile before merge without polluting the registry.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository }}

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR
      security-events: write  # upload Trivy SARIF to GH Security tab

    strategy:
      # Don't let one image's scan canceling the other — we want both the
      # backend and frontend results on every run.
      fail-fast: false
      matrix:
        component:
          - { name: backend,  context: ./backend,  dockerfile: ./backend/Dockerfile }
          - { name: frontend, context: ./frontend, dockerfile: ./frontend/Dockerfile }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/${{ matrix.component.name }}
          tags: |
            # Mutable "newest main commit" — distinct from `:latest`.
            type=edge,branch=main
            # Immutable per release tag.
            type=semver,pattern={{version}}
            # `:latest` ONLY on a real tag — not main. Prevents users
            # who pin `:latest` from getting unstable in-progress code.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Login to GHCR
        # Skip on PRs — no credentials to push, and the build below
        # uses `push: false` for PRs anyway.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR — scan only)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.dockerfile }}
          push: false
          load: true  # load into local docker for trivy
          tags: ${{ matrix.component.name }}:pr-scan
          cache-from: type=gha,scope=${{ matrix.component.name }}
          cache-to: type=gha,scope=${{ matrix.component.name }},mode=max

      - name: Build + Push (main / tag)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.dockerfile }}
          push: true
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component.name }}
          cache-to: type=gha,scope=${{ matrix.component.name }},mode=max

      # The merge-blocking gate. Uses `format: table` deliberately: in `sarif`
      # mode the action defaults `limit-severities-for-sarif: false`, so the
      # report (and the exit-code evaluation) covers ALL severities regardless
      # of the `severity` filter — a MEDIUM/LOW finding would then trip
      # `exit-code: "1"`. `table` honors the `severity` filter for the exit
      # code, so only HIGH/CRITICAL hard-fail. Both images were confirmed 0
      # HIGH/CRITICAL on 2026-06-03 (backend after `apt-get upgrade` in its
      # Dockerfile; frontend with the root `.trivyignore` dev-toolchain
      # allowlist), so this gate passes today and only a NEW HIGH/CRITICAL
      # fails the build.
      - name: Trivy scan (gate)
        # Run AFTER push so we get the same digest the registry has.
        # On PRs the scanned image is the local `:pr-scan` build.
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: >-
            ${{ github.event_name == 'pull_request'
                && format('{0}:pr-scan', matrix.component.name)
                || format('{0}/{1}/{2}:edge', env.REGISTRY, env.IMAGE_BASE, matrix.component.name) }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Report-only SARIF for the GH Security tab (and as a record). Never
      # blocks — the gate above is the source of truth.
      - name: Trivy scan (SARIF report)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: >-
            ${{ github.event_name == 'pull_request'
                && format('{0}:pr-scan', matrix.component.name)
                || format('{0}/{1}/{2}:edge', env.REGISTRY, env.IMAGE_BASE, matrix.component.name) }}
          format: sarif
          output: trivy-${{ matrix.component.name }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload SARIF to GH Security tab
        if: always()
        # Code scanning upload needs GitHub Advanced Security, which this
        # private repo doesn't have — the upload returns "Resource not
        # accessible by integration". Don't fail the job over it; the SARIF
        # is still kept as a build artifact for manual review.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.component.name }}.sarif
          category: trivy-${{ matrix.component.name }}
