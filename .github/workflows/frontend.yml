name: frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      # next.config / api.ts read NEXT_PUBLIC_API_URL at build time;
      # CI only needs a syntactically valid value (no live backend).
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_DEFAULT_LOCALE: en

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (npm ci)
        # `ci` uses the lockfile verbatim — no dependency drift between
        # dev install and CI install.
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        # `tsc --noEmit` runs the full type check without producing JS;
        # catches type errors that `next build` would otherwise hide
        # behind its own incremental checker.
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        run: npm run test -- --run

      - name: Build (next build)
        # Catches build-only errors (broken dynamic imports, missing
        # generateStaticParams cases, etc.) that lint + tsc miss.
        run: npm run build

      - name: Locale key parity
        # Asserts all 7 locale JSON files have the exact same key set
        # as en.json. Catches missing translations before they ship.
        working-directory: ${{ github.workspace }}
        run: |
          python3 - <<'EOF'
          import json, sys
          from pathlib import Path
          msgs = Path("frontend/messages")
          def flatten(d, prefix=""):
              keys = set()
              for k, v in d.items():
                  full = f"{prefix}.{k}" if prefix else k
                  keys |= flatten(v, full) if isinstance(v, dict) else {full}
              return keys
          ref = flatten(json.loads((msgs / "en.json").read_text(encoding="utf-8")))
          errors = []
          for fpath in sorted(msgs.glob("*.json")):
              if fpath.name == "en.json":
                  continue
              keys = flatten(json.loads(fpath.read_text(encoding="utf-8")))
              missing = ref - keys
              extra = keys - ref
              if missing:
                  errors.append(f"{fpath.name} missing {len(missing)} keys: {sorted(missing)[:5]}")
              if extra:
                  errors.append(f"{fpath.name} extra {len(extra)} keys: {sorted(extra)[:5]}")
          if errors:
              print("Locale key parity FAILED:")
              for e in errors:
                  print(" ", e)
              sys.exit(1)
          print(f"Locale key parity OK ({len(ref)} keys across all locales)")
          EOF

      - name: npm audit (production)
        # Fail the build only on HIGH+CRITICAL vulnerabilities in
        # runtime deps. Dev-only vulns are noted but not blocking —
        # they don't ship to users.
        run: npm audit --production --audit-level=high
