# TD-34 — automated dependency updates. Until now every CVE was
# hand-patched (see the 2026-06-01 security hot-patch round); this
# turns that reactive sweep into weekly PRs the regular CI gates
# (pytest / pip-audit / npm audit / Trivy) already know how to judge.
#
# Grouping: one PR per ecosystem per week for minor+patch bumps keeps
# the review load at "skim the lockfile diff, check CI is green".
# Major bumps stay individual PRs — those are the ones that break.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    groups:
      # Lint/test toolchain rides its OWN PR: a new ruff version means
      # new rules firing on existing code (39 findings on the first
      # scan), and that must not block 19 unrelated runtime bumps.
      python-tooling:
        patterns: ["ruff", "pytest*"]
      python-minor-patch:
        exclude-patterns: ["ruff", "pytest*"]
        update-types: [minor, patch]
    ignore:
      # arq (the worker's task queue) caps redis<6, and 0.28.0 is the
      # latest arq release — none allow redis>=6. So a redis-major bump
      # (e.g. #134's redis 8) can never resolve until arq ships redis-6+
      # support. Hold redis on the 5.x line; revisit when arq does.
      - dependency-name: "redis"
        update-types:
          - "version-update:semver-major"
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
    ignore:
      # Stay on the supported CPython 3.12 line: the code targets py312 (ruff
      # target-version), 3.12 is maintained to 2028, and 3.14-slim broke the
      # image build (C-extension deps lack 3.14 wheels). Patch tags still float
      # via `3.12-slim`. Revisit the minor deliberately, not on Dependabot's clock.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
    ignore:
      # Track the Active LTS Node line (24, EOL 2026-10). Node 26 is still in the
      # "Current" phase (not promoted to LTS until ~2027) — too new for a prod
      # runtime. Revisit as 24 nears EOL to step to the next LTS.
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
