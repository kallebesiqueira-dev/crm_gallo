# Alembic configuration for CRM Gallo backend.
#
# The DATABASE_URL is intentionally NOT set here — env.py pulls it from
# app.config.get_settings() at runtime so we have a single source of
# truth (env vars / .env file feed both the app and migrations).
#
# Run from the `backend/` directory:
#     alembic upgrade head                    # apply all pending migrations
#     alembic revision --autogenerate -m "…"  # generate a new migration
#     alembic downgrade -1                    # roll back the last migration
#     alembic history                         # list applied + pending
#     alembic current                         # which revision is the DB on
#     alembic stamp <rev>                     # mark DB as at <rev> without running

[alembic]
script_location = alembic
prepend_sys_path = .
# Left blank on purpose — env.py pulls DATABASE_URL from app.config.
sqlalchemy.url =

# File template — kept readable: short slug + UTC timestamp, no random hex.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
# Enable when ruff is in the backend image. For now: format manually.
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
