# Backend tooling config. Runtime deps live in `requirements.txt`
# (pinned, container-installed); this file is for the linter +
# formatter + any future build/packaging metadata.

[tool.ruff]
# 100 cols — strikes a balance between modern wide screens and code
# review readability on a side-by-side diff.
line-length = 100
target-version = "py312"
extend-exclude = [
    "alembic/versions/*",  # autogen'd files — manual edits annotated, not styled by ruff
    ".local",  # pip --user install dir (gitignored; only visible in the bind-mounted container, never in CI)
]

[tool.ruff.lint]
# Start with a solid default rule set. The full list is intentionally
# narrow so the first run doesn't drown the diff in autofixes; expand
# in follow-up PRs (`PL`, `PT`, `SIM`, `ARG` are the next obvious
# additions).
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (undefined names, unused imports, ...)
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear (likely-buggy constructs)
    "UP",  # pyupgrade (drop pre-py312 idioms)
    "RUF", # ruff-specific
    "C4",  # comprehensions
    "TID", # tidy imports (banned-relative, etc.)
]
ignore = [
    # `record_audit(..., metadata={"role": ...})` is fine even though
    # B006 thinks the mutable default could leak. Our metadata dicts
    # are constructed per-call, not a default arg.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Tests can `assert X` (B011) and use long-line table fixtures.
"tests/*.py" = ["E501", "B011"]
# Localized email copy + the inline-styled HTML layout are data, not
# logic — wrapping the translation strings would hurt readability.
"app/email/render.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.format]
# Black-compatible defaults. quote-style consistent with the rest
# of the codebase.
quote-style = "double"
indent-style = "space"
