[pytest]
# Discover tests under backend/tests/. Async tests use the
# pytest-asyncio "auto" mode so we don't need @pytest.mark.asyncio
# on every test function.
testpaths = tests
asyncio_mode = auto
# Share one event loop across all tests + fixtures in the session.
# Required because the app's asyncpg engine is module-scoped and its
# connection pool is bound to the loop that first used it — a fresh
# loop per test would invalidate every connection from test #2 on.
# pytest-asyncio 1.x exposes both scopes natively, so we pin fixtures
# AND tests to the session loop (the old 0.24 `event_loop`-override
# hack is gone).
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

# Quieter output for typical runs; --tb=short keeps tracebacks
# readable in CI logs without losing key frames.
addopts = -ra --tb=short --strict-markers

# Suppress noisy DeprecationWarnings from third-party deps that
# we can't fix (passlib's crypt dep, pydantic-jose).
filterwarnings =
    ignore::DeprecationWarning:passlib
    ignore::DeprecationWarning:jose
