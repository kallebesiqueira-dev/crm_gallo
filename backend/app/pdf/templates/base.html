<!DOCTYPE html>
<html lang="{{ locale|default('en') }}">
<head>
  <meta charset="utf-8" />
  <title>{% block title %}{{ org_name }}{% endblock %}</title>
  <style>
    @page {
      size: A4;
      margin: 2cm 2cm 2.5cm 2cm;
      @bottom-center {
        content: "{{ org_name }}  ·  page " counter(page) " / " counter(pages);
        font-family: 'DejaVu Sans', sans-serif;
        font-size: 8pt;
        color: #94a3b8;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'DejaVu Sans', sans-serif;
      color: #1e293b;
      font-size: 10.5pt;
      line-height: 1.5;
      margin: 0;
    }
    .brandbar {
      border-bottom: 3px solid #6366f1;
      padding-bottom: 12px;
      margin-bottom: 28px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .brandbar .brand { font-size: 18pt; font-weight: 700; color: #4f46e5; }
    .brandbar .doc-type {
      font-size: 9pt; text-transform: uppercase; letter-spacing: 0.08em; color: #64748b;
    }
    h1 { font-size: 16pt; margin: 0 0 4px; color: #0f172a; }
    .subtitle { color: #64748b; margin: 0 0 24px; font-size: 10pt; }
    table.fields { width: 100%; border-collapse: collapse; margin: 0 0 24px; }
    table.fields td { padding: 7px 0; vertical-align: top; border-bottom: 1px solid #f1f5f9; }
    table.fields td.label {
      width: 38%; color: #64748b; font-size: 9.5pt; text-transform: uppercase; letter-spacing: 0.03em;
    }
    table.fields td.value { color: #0f172a; font-weight: 500; }
    .pill {
      display: inline-block; padding: 2px 10px; border-radius: 999px;
      background: #eef2ff; color: #4338ca; font-size: 9pt; font-weight: 600;
    }
    .amount { font-size: 20pt; font-weight: 700; color: #4f46e5; }
    .footer-note { margin-top: 32px; padding-top: 12px; border-top: 1px solid #e2e8f0; color: #94a3b8; font-size: 8.5pt; }
  </style>
</head>
<body>
  <div class="brandbar">
    <span class="brand">{{ brand|default('CRM Gallo') }}</span>
    <span class="doc-type">{% block doc_type %}Document{% endblock %}</span>
  </div>
  {% block content %}{% endblock %}
  <div class="footer-note">
    {% block footer %}Generated by {{ brand|default('CRM Gallo') }} on {{ generated_at }}.{% endblock %}
  </div>
</body>
</html>
